name: Build AniVerse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # The five static weights are OFL-licensed binaries. Fetch them from the upstream project so
      # the repository stays source-only; the licence text is committed under docs/licenses.
      - name: Bundle Plus Jakarta Sans
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          base="https://raw.githubusercontent.com/tokotype/PlusJakartaSans/master/fonts/ttf"
          curl -fsSL "$base/PlusJakartaSans-Regular.ttf" -o app/src/main/res/font/plus_jakarta_sans_regular.ttf
          curl -fsSL "$base/PlusJakartaSans-Medium.ttf" -o app/src/main/res/font/plus_jakarta_sans_medium.ttf
          curl -fsSL "$base/PlusJakartaSans-SemiBold.ttf" -o app/src/main/res/font/plus_jakarta_sans_semibold.ttf
          curl -fsSL "$base/PlusJakartaSans-Bold.ttf" -o app/src/main/res/font/plus_jakarta_sans_bold.ttf
          curl -fsSL "$base/PlusJakartaSans-ExtraBold.ttf" -o app/src/main/res/font/plus_jakarta_sans_extrabold.ttf

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify palette contrast
        run: gradle :app:testDebugUnitTest --tests "app.aniverse.local.ThemeContrastTest" --console=plain

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          grep -aE '^e: |error:|FAILURE:|What went wrong|Execution failed|Could not (resolve|find|download)|Unresolved reference|Caused by:|> Task .*FAILED' "$LOG" | head -n 20 | cut -c1-900 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniVerse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Tag builds also publish the APK as a Release asset, so the download does not
  # expire with the workflow artifact. Only this job needs write access.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: AniVerse-debug-apk
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "AniVerse $GITHUB_REF_NAME" \
              --generate-notes
          fi
