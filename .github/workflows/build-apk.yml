name: Build AniVerse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          grep -aE '^e: |error:|FAILURE:|What went wrong|Execution failed|Could not (resolve|find|download)|Unresolved reference|Caused by:|> Task .*FAILED' "$LOG" | head -n 20 | cut -c1-900 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniVerse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
